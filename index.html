<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://airshare-pro.markiv.site/" />

    <!-- SEO -->
    <meta
      name="description"
      content="Air Share Pro is a secure, fast peer-to-peer file and clipboard sharing app. Connect devices instantly with a PIN, QR code, or sound-wave room pairing."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />
    <meta name="author" content="Vikram Bhardwaj" />
    <meta
      name="keywords"
      content="Air Share Pro, Air Share, secure file sharing, peer-to-peer file transfer, WebRTC, clipboard sharing"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#101317" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Air Share Pro" />
    <meta
      property="og:title"
      content="Air Share Pro — Secure, Fast File Sharing"
    />
    <meta
      property="og:description"
      content="Share files and clipboard text directly between devices with a PIN, QR code, or sound-wave room pairing."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://airshare-pro.markiv.site/"
    />
    <meta
      property="og:image"
      content="https://airshare-pro.markiv.site/apple-touch-icon.png"
    />
    <meta property="og:image:alt" content="Air Share Pro logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Air Share Pro — Secure, Fast File Sharing"
    />
    <meta
      name="twitter:description"
      content="Share files and clipboard text directly between devices with Air Share Pro."
    />
    <meta
      name="twitter:image"
      content="https://airshare-pro.markiv.site/apple-touch-icon.png"
    />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Page Title -->
    <title>
      Air Share Pro — Secure, Fast Peer-to-Peer File Sharing
    </title>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Air Share Pro",
            "alternateName": [
              "Air Share",
              "AirShare Pro"
            ],
            "url": "https://airshare-pro.markiv.site/"
          },
          {
            "@type": "Organization",
            "name": "Air Share Pro",
            "url": "https://airshare-pro.markiv.site/",
            "logo": "https://airshare-pro.markiv.site/apple-touch-icon.png"
          },
          {
            "@type": "WebApplication",
            "name": "Air Share Pro",
            "url": "https://airshare-pro.markiv.site/",
            "description": "A secure, fast peer-to-peer app for sharing files and clipboard text between devices.",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Web",
            "image": "https://airshare-pro.markiv.site/apple-touch-icon.png",
            "author": {
              "@type": "Person",
              "name": "Vikram Bhardwaj"
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
